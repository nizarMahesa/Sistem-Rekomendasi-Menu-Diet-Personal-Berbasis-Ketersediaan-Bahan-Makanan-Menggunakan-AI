<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekomendasi Menu - DietPlan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="index.html">🥗 DietPlan</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="bahan.html">Pilih Bahan</a></li>
        <li class="nav-item"><a class="nav-link active" href="rekomendasi.html">Rekomendasi</a></li>
        <li class="nav-item"><a class="nav-link" href="ringkasan.html">Ringkasan</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 mb-5 fade-in">
  <div class="row">
    <div class="col-lg-4 mb-4">
      <div class="card p-3 sticky-top" style="top:90px">
        <h5 class="mb-2">Panduan Pilihan</h5>
        <div id="guidePreview" class="small text-muted mb-3"></div>
        <div class="d-grid gap-2">
          <button onclick="addAvailableFromGuide()" class="btn btn-primary btn-sm">Tambah semua yang tersedia</button>
          <button onclick="addProteinCommon()" class="btn btn-outline-primary btn-sm">Tambah Sumber Protein</button>
          <button onclick="randomMenu()" class="btn btn-warning btn-sm">🎲 Acak Menu</button>
          <button onclick="openPlanModal()" class="btn btn-sm btn-success">Lihat Rencana Saya</button>
          <a href="bahan.html" class="btn btn-outline-secondary btn-sm">← Pilih Ulang Bahan</a>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card p-4">
        <h3 class="mb-0">🍽️ Rekomendasi Menu</h3>
        <p class="text-muted" id="infoRek"></p>
        <div id="alergiBadge"></div>
        <div id="rekomendasiNotice" class="mb-3"></div>

        <div class="card mb-3 p-3">
          <div class="row g-2 align-items-center">
            <div class="col-md-4"><input id="filterSearch" class="form-control" placeholder="Cari menu..."></div>
            <div class="col-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filterVeg">
                <label class="form-check-label small" for="filterVeg">Vegetarian</label>
              </div>
            </div>
            <div class="col-md-3">
              <select id="filterKategori" class="form-select">
                <option value="">Semua Kategori</option>
                <option value="sarapan">Sarapan</option>
                <option value="makan_siang">Makan Siang</option>
                <option value="makan_malam">Makan Malam</option>
                <option value="snack">Snack</option>
              </select>
            </div>
            <div class="col-auto"><input id="minKal" type="number" class="form-control form-control-sm" placeholder="Min kkal" style="width:100px"></div>
            <div class="col-auto"><input id="maxKal" type="number" class="form-control form-control-sm" placeholder="Max kkal" style="width:100px"></div>
            <div class="col-auto">
              <select id="sortBy" class="form-select form-select-sm">
                <option value="skor">Sort: Terbaik</option>
                <option value="kalori">Sort: Kalori</option>
                <option value="protein">Sort: Protein</option>
              </select>
            </div>
            <div class="col-auto ms-auto">
              <button onclick="applyFilterAction()" class="btn btn-sm btn-primary">Terapkan</button>
              <button onclick="clearFilterAction()" class="btn btn-sm btn-outline-secondary">Reset</button>
              <button onclick="openCompareModal()" class="btn btn-sm btn-success">Bandingkan</button>
            </div>
          </div>
        </div>

        <div id="hasilRek" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>

<!-- Plan Modal -->
<div class="modal fade" id="planModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Rencana Makanan Anda</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"><div id="planList">Memuat…</div></div>
      <div class="modal-footer d-flex justify-content-between flex-wrap gap-2">
        <div class="d-flex gap-2">
          <button onclick="exportPlanJSON()" class="btn btn-sm btn-outline-primary">Export JSON</button>
          <button onclick="exportPlanCSV()" class="btn btn-sm btn-outline-primary">Export CSV</button>
          <button onclick="printPlan()" class="btn btn-sm btn-outline-secondary">Print</button>
        </div>
        <div>
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Tutup</button>
          <button onclick="clearAllPlan()" class="btn btn-danger">Hapus Semua</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Compare Modal -->
<div class="modal fade" id="compareModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Perbandingan Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"><div id="compareArea" class="row"></div></div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>document.write('<script src="data.js?t='+Date.now()+'"><\/script>');</script>
<script>document.write('<script src="rekomendasi.js?t='+Date.now()+'"><\/script>');</script>
</body>
</html>
